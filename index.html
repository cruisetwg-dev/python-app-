<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3D Touch EQ</title>
<style>
  :root { --bg:#0b0d14; --fg:#e8ecf5; --muted:#8892a8; --accent:#5ee1ff; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  canvas { display:block; touch-action:none; }
  #bar { position:fixed; left:0; right:0; top:0; display:flex; flex-wrap:wrap; gap:8px;
    align-items:center; padding:10px 16px; background:linear-gradient(#0b0d14ee,#0b0d1400); z-index:2; }
  #bar h1 { font-size:15px; margin:0 8px 0 0; letter-spacing:.08em; text-transform:uppercase; }
  button, label.btn { background:#1a2030; color:var(--fg); border:1px solid #2c3550; border-radius:8px;
    padding:8px 14px; font-size:14px; cursor:pointer; }
  button:active, label.btn:active { background:#26304a; }
  button.on { border-color:var(--accent); color:var(--accent); }
  select { background:#1a2030; color:var(--fg); border:1px solid #2c3550; border-radius:8px; padding:8px; font-size:14px; }
  input[type=file] { display:none; }
  #hint { position:fixed; left:0; right:0; bottom:10px; text-align:center; font-size:12px; color:var(--muted);
    pointer-events:none; padding:0 16px; }
  #readout { position:fixed; right:16px; top:56px; font:12px ui-monospace,Menlo,monospace; color:var(--muted);
    text-align:right; line-height:1.6; pointer-events:none; }
</style>
</head>
<body>
<div id="bar">
  <h1>3D Touch EQ</h1>
  <button id="play">▶ Start</button>
  <select id="source" aria-label="Audio source">
    <option value="synth">Demo loop</option>
    <option value="noise">Pink noise</option>
    <option value="file">Audio file…</option>
    <option value="mic">Microphone</option>
  </select>
  <label class="btn" for="file">Load file</label>
  <input id="file" type="file" accept="audio/*">
  <select id="preset" aria-label="Target preset">
    <option value="">Preset…</option>
  </select>
  <button id="reset">Reset EQ</button>
</div>
<div id="readout"></div>
<div id="hint">Drag a fader up/down to change that band live · drag the background to orbit · pinch/scroll to zoom · double-tap a fader to reset it</div>

<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { EQ } from './eq.js';
import { AudioEngine } from './audio.js';
import { TARGET_PRESETS } from './presets.js';

const BANDS = EQ.bands;                       // [{name, type, freq, q, color}]
const RANGE = EQ.rangeDb;                     // ±dB
const TRACK_H = 3;                            // fader travel in world units
const dbToY = db => (db / RANGE) * (TRACK_H / 2);
const yToDb = y => Math.max(-RANGE, Math.min(RANGE, (y / (TRACK_H / 2)) * RANGE));

const audio = new AudioEngine(BANDS);

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d14);
scene.fog = new THREE.Fog(0x0b0d14, 12, 30);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(4, 8, 6); scene.add(key);

// floor grid
const grid = new THREE.GridHelper(30, 30, 0x2c3550, 0x161c2c); grid.position.y = -TRACK_H/2 - 0.6; scene.add(grid);

// spectrum bars behind the faders
const NBARS = 48;
const bars = [];
const barGeo = new THREE.BoxGeometry(0.22, 1, 0.22);
for (let i = 0; i < NBARS; i++) {
  const m = new THREE.MeshStandardMaterial({ color:new THREE.Color().setHSL(0.55 + 0.45 * i / NBARS, 0.8, 0.55), emissiveIntensity:0.4 });
  m.emissive = m.color.clone().multiplyScalar(0.4);
  const b = new THREE.Mesh(barGeo, m);
  b.position.set((i - NBARS/2) * 0.27, -TRACK_H/2 - 0.6, -3);
  scene.add(b); bars.push(b);
}

// faders
const faders = BANDS.map((band, i) => {
  const x = (i - 1) * 2.4;
  const g = new THREE.Group(); g.position.x = x; scene.add(g);
  const color = new THREE.Color(band.color);

  const slot = new THREE.Mesh(new THREE.BoxGeometry(0.16, TRACK_H + 0.4, 0.16),
    new THREE.MeshStandardMaterial({ color:0x1a2030, roughness:0.6 }));
  g.add(slot);
  // tick marks: -max, 0, +max
  [-RANGE, 0, RANGE].forEach(db => {
    const t = new THREE.Mesh(new THREE.BoxGeometry(db === 0 ? 1.1 : 0.7, 0.03, 0.03),
      new THREE.MeshBasicMaterial({ color: db === 0 ? 0x5a6688 : 0x2c3550 }));
    t.position.y = dbToY(db); g.add(t);
  });
  // glowing fill from 0 dB to handle
  const fill = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1, 0.22),
    new THREE.MeshStandardMaterial({ color, emissive:color, emissiveIntensity:0.8 }));
  g.add(fill);
  // handle
  const handle = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.38, 0.6),
    new THREE.MeshStandardMaterial({ color:0xdfe6f5, metalness:0.4, roughness:0.35, emissive:color, emissiveIntensity:0.15 }));
  handle.userData.index = i; g.add(handle);
  // generous invisible touch target
  const hit = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.0, 1.2), new THREE.MeshBasicMaterial({ visible:false }));
  hit.userData.index = i; handle.add(hit);

  // label sprite
  const label = makeLabel(band.name, band.freqLabel, band.color);
  label.position.set(0, -TRACK_H/2 - 0.55, 0.3);
  g.add(label);
  const value = makeValueSprite();
  value.position.set(0, TRACK_H/2 + 0.6, 0);
  g.add(value);

  return { band, group:g, handle, hit, fill, value, db:0 };
});

function makeLabel(name, sub, color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const x = c.getContext('2d');
  x.textAlign = 'center'; x.fillStyle = color; x.font = 'bold 54px system-ui'; x.fillText(name, 128, 62);
  x.fillStyle = '#8892a8'; x.font = '30px system-ui'; x.fillText(sub, 128, 106);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false }));
  s.scale.set(1.6, 0.8, 1); return s;
}
function makeValueSprite() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 96;
  const tex = new THREE.CanvasTexture(c);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false }));
  s.scale.set(1.6, 0.6, 1); s.userData = { c, tex }; return s;
}
function drawValue(sprite, db) {
  const { c, tex } = sprite.userData; const x = c.getContext('2d');
  x.clearRect(0, 0, c.width, c.height);
  x.textAlign = 'center'; x.fillStyle = '#e8ecf5'; x.font = 'bold 44px ui-monospace,Menlo,monospace';
  x.fillText((db > 0 ? '+' : '') + db.toFixed(1) + ' dB', 128, 62);
  tex.needsUpdate = true;
}

function setFader(i, db, fromUser = true) {
  const f = faders[i];
  f.db = Math.round(db * 10) / 10;
  const y = dbToY(f.db);
  f.handle.position.y = y;
  const h = Math.max(Math.abs(y), 0.001);
  f.fill.scale.y = h; f.fill.position.y = y / 2;
  drawValue(f.value, f.db);
  if (fromUser) audio.setGain(i, f.db);       // real-time: applied immediately to the live filter
  renderReadout();
}
function renderReadout() {
  document.getElementById('readout').innerHTML = faders.map(f =>
    `${f.band.name} ${f.band.freqLabel}: <b style="color:${f.band.color}">${f.db > 0 ? '+' : ''}${f.db.toFixed(1)} dB</b>`).join('<br>');
}
faders.forEach((_, i) => setFader(i, 0, false));

// ---------- interaction (pointer events = mouse + touch + pen, multi-touch capable) ----------
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const active = new Map();     // pointerId -> {kind:'fader'|'orbit', ...}
const el = renderer.domElement;
const orbit = { theta:0, phi:0.2, dist:9, target:new THREE.Vector3(0, 0, 0) };
const pinch = { d:0 };

function setNdc(e) {
  const r = el.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
}
// project the pointer ray onto the fader's vertical plane (facing the camera, through the fader axis)
function pointerToDb(e, f) {
  setNdc(e); ray.setFromCamera(ndc, camera);
  const n = camera.getWorldDirection(new THREE.Vector3()); n.y = 0; n.normalize().negate();
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(n, f.group.position);
  const p = new THREE.Vector3();
  if (!ray.ray.intersectPlane(plane, p)) return null;
  return yToDb(p.y - f.group.position.y);
}
let lastTap = { t:0, i:-1 };

el.addEventListener('pointerdown', e => {
  el.setPointerCapture(e.pointerId);
  setNdc(e); ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(faders.flatMap(f => [f.hit, f.handle]), false);
  if (hits.length) {
    const i = hits[0].object.userData.index;
    const now = performance.now();
    if (lastTap.i === i && now - lastTap.t < 320) { setFader(i, 0); }
    lastTap = { t:now, i };
    const f = faders[i];
    const grabDb = pointerToDb(e, f);
    active.set(e.pointerId, { kind:'fader', i, offset: grabDb == null ? 0 : f.db - grabDb });
    f.handle.material.emissiveIntensity = 0.6;
    audio.resume();
  } else {
    active.set(e.pointerId, { kind:'orbit', x:e.clientX, y:e.clientY });
  }
});
el.addEventListener('pointermove', e => {
  const a = active.get(e.pointerId); if (!a) return;
  if (a.kind === 'fader') {
    const db = pointerToDb(e, faders[a.i]);
    if (db != null) setFader(a.i, yToDb(((db + a.offset) / RANGE) * (TRACK_H / 2)));
  } else {
    const orbiters = [...active.values()].filter(v => v.kind === 'orbit');
    if (orbiters.length >= 2) {                // two-finger pinch zoom
      const pts = [...active.entries()].filter(([, v]) => v.kind === 'orbit');
      a.x = e.clientX; a.y = e.clientY;
      const [p, q] = pts.map(([, v]) => v);
      const d = Math.hypot(p.x - q.x, p.y - q.y);
      if (pinch.d) orbit.dist = Math.max(4, Math.min(20, orbit.dist * (pinch.d / d)));
      pinch.d = d; return;
    }
    orbit.theta -= (e.clientX - a.x) * 0.006;
    orbit.phi = Math.max(-0.2, Math.min(1.2, orbit.phi + (e.clientY - a.y) * 0.006));
    a.x = e.clientX; a.y = e.clientY;
  }
});
const end = e => {
  const a = active.get(e.pointerId);
  if (a && a.kind === 'fader') faders[a.i].handle.material.emissiveIntensity = 0.15;
  active.delete(e.pointerId); pinch.d = 0;
};
el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
el.addEventListener('wheel', e => { e.preventDefault(); orbit.dist = Math.max(4, Math.min(20, orbit.dist * (1 + e.deltaY * 0.001))); }, { passive:false });

// ---------- UI ----------
const playBtn = document.getElementById('play');
const sourceSel = document.getElementById('source');
const fileIn = document.getElementById('file');
async function startSource() {
  try {
    await audio.start(sourceSel.value, fileIn.files[0]);
    playBtn.textContent = '■ Stop'; playBtn.classList.add('on');
  } catch (err) { alert('Could not start audio: ' + err.message); }
}
playBtn.onclick = async () => {
  if (audio.playing) { audio.stop(); playBtn.textContent = '▶ Start'; playBtn.classList.remove('on'); }
  else await startSource();
};
sourceSel.onchange = () => { if (audio.playing) startSource(); };
fileIn.onchange = () => { if (fileIn.files[0]) { sourceSel.value = 'file'; startSource(); } };
document.getElementById('reset').onclick = () => { faders.forEach((_, i) => setFader(i, 0)); presetSel.value = ''; };

// presets: low/mid/high are dB offsets applied to the faders, master is linear output gain.
// lufs/truePeak are delivery targets, shown for reference (no loudness metering/limiting here).
const presetSel = document.getElementById('preset');
for (const [id, p] of Object.entries(TARGET_PRESETS)) {
  const o = document.createElement('option'); o.value = id;
  o.textContent = p.lufs == null ? `${id} · ${p.label}` : `${id} · ${p.label} (${p.lufs} LUFS, ${p.truePeak} dBTP)`;
  presetSel.appendChild(o);
}
presetSel.onchange = () => {
  const p = TARGET_PRESETS[presetSel.value]; if (!p || p.passiveOnly) return;   // Test: leave everything as is
  setFader(0, p.low); setFader(1, p.mid); setFader(2, p.high);
  audio.setMaster(p.master);
};

// ---------- loop ----------
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h;
  orbit.baseDist = w < h ? 12 : 9;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
orbit.dist = innerWidth < innerHeight ? 12 : 9;

const spec = new Uint8Array(1024);
function frame() {
  requestAnimationFrame(frame);
  const cp = Math.cos(orbit.phi), sp = Math.sin(orbit.phi);
  camera.position.set(orbit.target.x + orbit.dist * Math.sin(orbit.theta) * cp,
                      orbit.target.y + orbit.dist * sp,
                      orbit.target.z + orbit.dist * Math.cos(orbit.theta) * cp);
  camera.lookAt(orbit.target);

  const n = audio.spectrum(spec);               // log-spaced bins -> bars
  for (let i = 0; i < NBARS; i++) {
    const v = n ? spec[Math.floor(Math.pow(i / NBARS, 2.2) * (n - 1))] / 255 : 0;
    const h = 0.05 + v * 3.2;
    bars[i].scale.y += (h - bars[i].scale.y) * 0.4;
    bars[i].position.y = -TRACK_H/2 - 0.6 + bars[i].scale.y / 2;
  }
  renderer.render(scene, camera);
}
frame();
</script>
</body>
</html>
