<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cruise Mixed</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@400;500;600&display=swap">
<style>
  /* Tactile elegance: machined graphite desk, aluminum caps, brass and copper indicators, warm key light. */
  :root {
    --bg:#121316; --panel:#1b1d21; --edge:#33363d; --ink:#e9e6df; --muted:#8f8c84;
    --brass:#d2ad6a; --copper:#cf7f5c; --steel:#9fc0d4;
    --label:"Jost", "Futura", "Avenir Next", system-ui, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--label); overflow:hidden; }
  canvas { display:block; touch-action:none; }
  #bar { position:fixed; left:0; right:0; top:0; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    padding:12px 16px; z-index:2; background:linear-gradient(#121316f2, #12131600); }
  #bar h1 { display:flex; align-items:center; gap:10px; font-size:12px; font-weight:500; margin:0 10px 0 0; letter-spacing:.28em; text-transform:uppercase; color:var(--ink); }
  .badge { width:34px; height:34px; border-radius:50%; background:#000; border:1px solid var(--edge); box-shadow:0 0 12px #d2ad6a22; display:grid; place-items:center; flex:none; }
  .badge img { width:76%; height:76%; display:block; }
  button, label.btn, select {
    font:500 12px var(--label); letter-spacing:.1em; text-transform:uppercase; color:var(--ink);
    padding:9px 15px; border-radius:10px; border:1px solid var(--edge); cursor:pointer;
    background:linear-gradient(#2a2d33, #1c1e23); box-shadow:inset 0 1px 0 #ffffff12, 0 1px 2px #0008;
  }
  select { text-transform:none; letter-spacing:.04em; font-size:13px; padding-right:10px; }
  button:active, label.btn:active { background:linear-gradient(#1c1e23, #25282e); box-shadow:inset 0 1px 3px #000a; }
  button.on { color:var(--brass); border-color:#6f5a34; box-shadow:inset 0 1px 0 #ffffff12, 0 0 14px #d2ad6a33; }
  button:focus-visible, select:focus-visible, label.btn:focus-within { outline:2px solid var(--brass); outline-offset:2px; }
  input[type=file] { display:none; }
  #hint { position:fixed; left:0; right:0; bottom:10px; text-align:center; font-size:12px; letter-spacing:.04em;
    color:var(--muted); pointer-events:none; padding:0 16px; }
  #readout, #meter { position:fixed; right:16px; font:400 12px var(--mono); color:var(--muted); text-align:right;
    line-height:1.7; pointer-events:none; }
  #readout { top:60px; }
  #meter { bottom:34px; }
  #readout b, #meter b { color:var(--ink); font-weight:500; }
</style>
</head>
<body>
<div id="bar">
  <h1><span class="badge"><img src="./assets/cm-logo.png" alt=""></span>Cruise Mixed</h1>
  <button id="play">▶ Start</button>
  <select id="source" aria-label="Audio source">
    <option value="synth">Demo loop</option>
    <option value="noise">Pink noise</option>
    <option value="file">Audio file…</option>
    <option value="mic">Microphone</option>
  </select>
  <label class="btn" for="file">Load file</label>
  <input id="file" type="file" accept="audio/*">
  <select id="preset" aria-label="Target preset">
    <option value="">Preset…</option>
  </select>
  <button id="reset">Reset EQ</button>
</div>
<div id="readout"></div>
<div id="meter"></div>
<div id="hint">Drag a fader to shape that band live · drag the background to orbit · pinch or scroll to zoom · double-tap a fader to reset it</div>

<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { EQ, MASTER_PRESETS, getPresetById } from './eq.js';
import { AudioEngine } from './audio.js';

const BANDS = EQ.bands;                       // [{name, type, freq, q, color}]
const RANGE = EQ.rangeDb;                     // ±dB
const TRACK_H = 3;                            // fader travel in world units
const DESK_Y = -2.1;                          // top surface of the desk
const dbToY = db => (db / RANGE) * (TRACK_H / 2);
const yToDb = y => Math.max(-RANGE, Math.min(RANGE, (y / (TRACK_H / 2)) * RANGE));

// Indicator colors for the visual design (eq.js keeps its own band colors untouched).
const SKIN = { LOW:'#cf7f5c', MID:'#d2ad6a', HIGH:'#9fc0d4' };
const skin = band => SKIN[band.name] ?? band.color;
const INK = '#e9e6df', MUTED = '#8f8c84';
const LABEL_FONT = '"Jost", "Futura", system-ui, sans-serif', MONO_FONT = '"IBM Plex Mono", ui-monospace, Menlo, monospace';

const audio = new AudioEngine(BANDS);

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121316);
scene.fog = new THREE.Fog(0x121316, 14, 34);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);

// A tiny studio for the metal to reflect: dark room, a big overhead softbox and a warm strip light.
(function makeEnv() {
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(24, 12, 24), new THREE.MeshBasicMaterial({ color:0x1a1b1f, side:THREE.BackSide })));
  const panel = (w, h, color, k, pos, rx, ry) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color:new THREE.Color(color).multiplyScalar(k), side:THREE.DoubleSide }));
    m.position.set(...pos); m.rotation.set(rx, ry, 0); env.add(m);
  };
  panel(10, 5, 0xffffff, 6, [0, 5.5, 1], Math.PI / 2, 0);
  panel(1.2, 7, 0xffd9a8, 8, [-9, 0, 2], 0, Math.PI / 2);
  panel(0.8, 6, 0x9db4d6, 4, [9, 0, -3], 0, -Math.PI / 2);
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(env, 0.04).texture;
})();

scene.add(new THREE.AmbientLight(0xffffff, 0.12));
const key = new THREE.DirectionalLight(0xffe6c4, 2.4); key.position.set(4, 8, 6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0005; key.shadow.normalBias = 0.02;
Object.assign(key.shadow.camera, { left:-9, right:9, top:9, bottom:-9, near:1, far:26 });
scene.add(key);
const rim = new THREE.DirectionalLight(0x9db4d6, 0.9); rim.position.set(-5, 3, -6); scene.add(rim);

function roundedBox(w, h, d, r, b) {            // rounded-rectangle slab with a soft machined edge; extruded along z
  const x = -w / 2, y = -h / 2, s = new THREE.Shape();
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  const g = new THREE.ExtrudeGeometry(s, { depth:d - 2 * b, bevelEnabled:true, bevelThickness:b, bevelSize:b, bevelSegments:3, curveSegments:8 });
  g.translate(0, 0, -(d - 2 * b) / 2);
  return g;
}
function brushedTexture() {                      // fine horizontal streaks for the anodized desk top
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'); x.fillStyle = '#808080'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1600; i++) {
    const v = 100 + Math.random() * 60;
    x.strokeStyle = `rgba(${v},${v},${v},0.18)`; x.lineWidth = 1;
    const y = Math.random() * 256, x0 = Math.random() * 256;
    x.beginPath(); x.moveTo(x0, y); x.lineTo(x0 + 40 + Math.random() * 160, y); x.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(0.25, 0.25); return t;
}

// desk and ground
const desk = new THREE.Mesh(roundedBox(12.4, 6.4, 0.4, 0.35, 0.06).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color:0x2a2c32, metalness:0.75, roughness:0.4, bumpMap:brushedTexture(), bumpScale:0.5, envMapIntensity:0.6 }));
desk.position.set(0, DESK_Y - 0.2, -0.8); desk.receiveShadow = true; scene.add(desk);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ opacity:0.5 }));   // shadow only: the desk floats in the dark
ground.position.y = DESK_Y - 0.7; ground.receiveShadow = true; scene.add(ground);

// spectrum: slim brass-to-ivory light columns standing on the desk behind the faders
const NBARS = 48, bars = [];
const barGeo = new THREE.BoxGeometry(0.09, 1, 0.09);
for (let i = 0; i < NBARS; i++) {
  const col = new THREE.Color(0xe9e6df).lerp(new THREE.Color(0xd2ad6a), i / (NBARS - 1));
  const b = new THREE.Mesh(barGeo, new THREE.MeshStandardMaterial({ color:col, emissive:col, emissiveIntensity:0.35, roughness:0.4, metalness:0.2 }));
  b.position.set((i - (NBARS - 1) / 2) * 0.2, DESK_Y, -3);
  scene.add(b); bars.push(b);
}

// backdrop: a concrete wall with one spray-painted ghost, brass halo and drips. It breathes with the bass.
const wallTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'); x.fillStyle = '#808080'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 9000; i++) { const v = 90 + Math.random() * 90; x.fillStyle = `rgba(${v},${v},${v},0.35)`; x.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 2, 1 + Math.random() * 2); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4, 2.5); return t;
})();
const wall = new THREE.Mesh(new THREE.PlaneGeometry(16, 9), new THREE.MeshStandardMaterial({ color:0x1b1c21, roughness:0.95, bumpMap:wallTex, bumpScale:0.8 }));
wall.position.set(0, 2.2, -4.3); wall.receiveShadow = true; scene.add(wall);

const LOGO_SRC = './assets/cm-logo.png';        // ivory brush strokes of the "Cm" monogram on a transparent background
const graffiti = (() => {
  const W = 1792, H = 1024, IVORY = '#e9e6df', BRASS = '#d2ad6a';
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(14, 8), new THREE.MeshBasicMaterial({ map:tex, transparent:true, opacity:0.55, depthWrite:false, toneMapped:false }));
  m.scale.setScalar(0.45); m.position.set(0, 3.35, -4.28); scene.add(m);   // hangs above the faders, clear of the readouts

  // spray: three soft passes (haze, glow, core), each drawn twice with a shaky hand, then overspray speckle near the line
  const spray = (path, color, lw, speckle = 500) => {
    for (const [mult, a, blur] of [[3.4, 0.10, 34], [1.9, 0.22, 14], [1, 0.85, 4]]) {
      for (let j = 0; j < 2; j++) {
        x.save(); x.translate((Math.random() - 0.5) * 2.2, (Math.random() - 0.5) * 2.2);
        x.lineWidth = lw * mult * (j ? 0.8 : 1); x.globalAlpha = a * (j ? 0.6 : 1);
        x.shadowBlur = blur; x.shadowColor = color; x.strokeStyle = color; x.lineCap = x.lineJoin = 'round';
        x.stroke(path); x.restore();
      }
    }
    x.save(); x.lineWidth = 30; let n = 0;
    for (let t = 0; t < 16000 && n < speckle; t++) {
      const px = 480 + Math.random() * 840, py = 20 + Math.random() * 990;
      if (x.isPointInStroke(path, px, py)) { x.fillStyle = color; x.globalAlpha = 0.12 + Math.random() * 0.3; x.beginPath(); x.arc(px, py, 0.6 + Math.random() * 1.6, 0, 7); x.fill(); n++; }
    }
    x.restore();
  };
  const drip = (dx, y0, len, lw) => {                                       // a run of paint with a bead at the end
    const p = new Path2D(); p.moveTo(dx, y0); p.lineTo(dx, y0 + len); spray(p, IVORY, lw, 60);
    x.save(); x.fillStyle = IVORY; x.shadowColor = IVORY; x.shadowBlur = 10; x.globalAlpha = 0.9;
    x.beginPath(); x.arc(dx, y0 + len, lw * 1.35, 0, 7); x.fill(); x.restore();
  };
  const star = (sx, sy, r) => { const p = new Path2D(); p.moveTo(sx, sy - r); p.quadraticCurveTo(sx, sy, sx + r, sy); p.quadraticCurveTo(sx, sy, sx, sy + r); p.quadraticCurveTo(sx, sy, sx - r, sy); p.quadraticCurveTo(sx, sy, sx, sy - r); return p; };

  const img = new Image();
  img.onload = () => {
    const R = 330, cx = 896, cy = 400, D = 2 * R, ox = cx - R, oy = cy - R;
    // the monogram: glow passes in brass, then the crisp ivory core, hand-shaken
    const paint = (blur, color, alpha, jx, jy) => { x.save(); x.shadowColor = color; x.shadowBlur = blur; x.globalAlpha = alpha; x.drawImage(img, ox + jx, oy + jy, D, D); x.restore(); };
    paint(44, BRASS, 0.40, 0, 0); paint(18, BRASS, 0.65, 0, 0); paint(2, IVORY, 0.60, 1.4, -1); paint(2, IVORY, 0.95, -0.8, 0.8);
    // overspray: specks where the paint would drift off the strokes
    const oc = document.createElement('canvas'); oc.width = oc.height = D; const ox2 = oc.getContext('2d'); ox2.drawImage(img, 0, 0, D, D);
    const a = ox2.getImageData(0, 0, D, D).data, A = (px, py) => (px < 0 || py < 0 || px >= D || py >= D) ? 0 : a[(py * D + px) * 4 + 3];
    x.save(); x.fillStyle = IVORY;
    for (let t = 0, n = 0; t < 40000 && n < 900; t++) {
      const px = Math.random() * D | 0, py = Math.random() * D | 0;
      const ang = Math.random() * 6.283, d = 6 + Math.random() * 18;
      if (A(px, py) < 30 && A(px + Math.cos(ang) * d | 0, py + Math.sin(ang) * d | 0) > 150) {
        x.globalAlpha = 0.15 + Math.random() * 0.35; x.beginPath(); x.arc(ox + px, oy + py, 0.6 + Math.random() * 1.6, 0, 7); x.fill(); n++;
      }
    }
    x.restore();
    // brass ring around it
    const ring = new Path2D(); ring.arc(cx, cy, R + 8, 0, Math.PI * 2); spray(ring, BRASS, 4.5, 700);
    // drips: off the ring and off the feet of the "m"
    drip(cx - 230, cy + Math.sqrt((R + 8) ** 2 - 230 ** 2) - 2, 120, 4); drip(cx + 240, cy + Math.sqrt((R + 8) ** 2 - 240 ** 2) - 2, 80, 3.5);
    const lowest = fx => { for (let py = D - 1; py >= 0; py--) for (let dx = -6; dx <= 6; dx++) if (A((fx * D | 0) + dx, py) > 128) return py; return D * 0.8; };
    drip(ox + D * 0.71, oy + lowest(0.71) - 2, 60, 3.5); drip(ox + D * 0.5, oy + lowest(0.5) - 2, 45, 3);
    // stars
    [[cx - 460, cy - 150, 22], [cx + 470, cy - 60, 16], [cx - 420, cy + 190, 12], [cx + 400, cy + 230, 20], [cx + 60, cy - 390, 12]]
      .forEach(([sx, sy, r]) => spray(star(sx, sy, r), BRASS, 2.5, 60));
    tex.needsUpdate = true;
  };
  img.src = LOGO_SRC;
  return m;
})();
let bass = 0;

// canvas-drawn engravings (redrawn once the web fonts arrive)
const redraws = [];
function engraving(w, h, draw, mat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const paint = () => { const x = c.getContext('2d'); x.clearRect(0, 0, w, h); draw(x, w, h); tex.needsUpdate = true; };
  paint(); redraws.push(paint); return { c, tex, paint };
}
const PX = 320;                                  // scale-plane pixels per world unit
const scaleTick = db => Math.round(TRACK_H / 2 * PX * (db / RANGE));
function drawScale(x, w, h) {
  x.textBaseline = 'middle';
  for (let db = -RANGE; db <= RANGE; db++) {
    const y = h / 2 - scaleTick(db), major = db % 5 === 0;
    x.strokeStyle = db === 0 ? 'rgba(233,230,223,1)' : (major ? 'rgba(233,230,223,.85)' : 'rgba(233,230,223,.4)');
    x.lineWidth = major ? 3 : 2; x.beginPath(); x.moveTo(w - 4, y); x.lineTo(w - (major ? 44 : 24), y); x.stroke();
    if (major) { x.fillStyle = db === 0 ? INK : '#b9b5ab'; x.font = `500 32px ${MONO_FONT}`; x.textAlign = 'right';
      x.fillText(db > 0 ? `+${db}` : db < 0 ? `−${-db}` : '0', w - 56, y); }
  }
}

// faders
const faders = BANDS.map((band, i) => {
  const g = new THREE.Group(); g.position.x = (i - 1) * 2.7; scene.add(g);
  const color = new THREE.Color(skin(band));
  const metal = (c, m, r, e = 1) => new THREE.MeshStandardMaterial({ color:c, metalness:m, roughness:r, envMapIntensity:e });
  const add = (mesh, parent = g) => { mesh.castShadow = true; parent.add(mesh); return mesh; };

  // socket, slot with two machined rails, engraved dB scale
  add(new THREE.Mesh(roundedBox(0.8, 0.4, 0.6, 0.08, 0.03), metal(0x1d1f23, 0.8, 0.4))).position.y = DESK_Y + 0.2;
  const slot = new THREE.Mesh(new THREE.BoxGeometry(0.12, TRACK_H + 0.4, 0.1), metal(0x050607, 0.2, 0.9)); g.add(slot);
  for (const sx of [-0.1, 0.1]) { const r = add(new THREE.Mesh(new THREE.BoxGeometry(0.03, TRACK_H + 0.4, 0.14), metal(0x8d9097, 0.9, 0.35))); r.position.x = sx; }
  const sc = engraving(224, Math.round((TRACK_H + 0.4) * PX), drawScale);
  const scale = new THREE.Mesh(new THREE.PlaneGeometry(224 / PX, TRACK_H + 0.4), new THREE.MeshBasicMaterial({ map:sc.tex, transparent:true, depthWrite:false }));
  scale.position.set(-0.2 - 112 / PX, 0, 0.072); g.add(scale);

  // lit inlay from 0 dB to the cap
  const fill = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1, 0.04), new THREE.MeshStandardMaterial({ color, emissive:color, emissiveIntensity:1.3, roughness:0.4 }));
  fill.position.z = 0.055; g.add(fill);

  // cap: machined aluminum, ridged grip, lit indicator line
  const handle = new THREE.Group(); g.add(handle);
  add(new THREE.Mesh(roundedBox(0.95, 0.5, 0.5, 0.08, 0.05), metal(0xc9ccd1, 0.95, 0.28, 1.25)), handle).position.z = 0.0;
  for (const gy of [-0.17, -0.1, 0.1, 0.17]) {
    const gr = new THREE.Mesh(new THREE.BoxGeometry(0.84, 0.016, 0.02), metal(0x2a2c30, 0.5, 0.5)); gr.position.set(0, gy, 0.255); handle.add(gr);
  }
  const glow = new THREE.Mesh(new THREE.BoxGeometry(0.84, 0.03, 0.02), new THREE.MeshStandardMaterial({ color, emissive:color, emissiveIntensity:0.9, roughness:0.3 }));
  glow.position.set(0, 0, 0.256); handle.add(glow);
  const hit = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.0, 1.2), new THREE.MeshBasicMaterial({ visible:false })); handle.add(hit);
  handle.traverse(o => { if (o.isMesh) o.userData.index = i; });

  const label = makeLabel(band.name, band.freqLabel, skin(band));
  label.position.set(0, DESK_Y + 0.42, 0.95); g.add(label);
  const value = makeValueSprite(); value.position.set(0, TRACK_H / 2 + 0.55, 0); g.add(value);

  return { band, group:g, handle, hit, fill, glow, value, db:0 };
});

function makeLabel(name, sub, color) {
  const e = engraving(256, 128, (x, w) => {
    x.textAlign = 'center'; x.textBaseline = 'alphabetic';
    x.fillStyle = color; x.font = `600 50px ${LABEL_FONT}`; try { x.letterSpacing = '6px'; } catch {}
    x.fillText(name, w / 2 + 3, 64);
    x.fillStyle = MUTED; x.font = `400 26px ${MONO_FONT}`; try { x.letterSpacing = '0px'; } catch {}
    x.fillText(sub, w / 2, 104);
  });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:e.tex, transparent:true, depthWrite:false }));
  s.scale.set(1.6, 0.8, 1); return s;
}
function makeValueSprite() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 96;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false }));
  s.scale.set(1.6, 0.6, 1); s.userData = { c, tex }; return s;
}
function drawValue(sprite, db) {
  const { c, tex } = sprite.userData, x = c.getContext('2d');
  x.clearRect(0, 0, c.width, c.height); x.textBaseline = 'alphabetic'; x.textAlign = 'left';
  const num = (db > 0 ? '+' : db < 0 ? '−' : '') + Math.abs(db).toFixed(1);
  x.font = `500 46px ${MONO_FONT}`; const w1 = x.measureText(num).width;
  x.font = `400 24px ${MONO_FONT}`; const w2 = x.measureText(' dB').width;
  const x0 = (c.width - (w1 + w2)) / 2;
  x.fillStyle = INK; x.font = `500 46px ${MONO_FONT}`; x.fillText(num, x0, 62);
  x.fillStyle = MUTED; x.font = `400 24px ${MONO_FONT}`; x.fillText(' dB', x0 + w1, 62);
  tex.needsUpdate = true;
}

function setFader(i, db, fromUser = true) {
  const f = faders[i];
  f.db = Math.round(db * 10) / 10;
  const y = dbToY(f.db);
  f.handle.position.y = y;
  const h = Math.max(Math.abs(y), 0.001);
  f.fill.scale.y = h; f.fill.position.y = y / 2;
  drawValue(f.value, f.db);
  if (fromUser) audio.setGain(i, f.db);       // real-time: applied immediately to the live filter
  renderReadout();
}
function renderReadout() {
  const sign = d => (d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(d).toFixed(1);
  document.getElementById('readout').innerHTML = faders.map(f =>
    `<span style="color:${skin(f.band)}">●</span> ${f.band.name} ${f.band.freqLabel} <b>${sign(f.db)} dB</b>`).join('<br>');
}
faders.forEach((_, i) => setFader(i, 0, false));
document.fonts?.ready.then(() => { redraws.forEach(p => p()); faders.forEach(f => drawValue(f.value, f.db)); });

// ---------- interaction (pointer events = mouse + touch + pen, multi-touch capable) ----------
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const active = new Map();     // pointerId -> {kind:'fader'|'orbit', ...}
const el = renderer.domElement;
const orbit = { theta:0, phi:0.3, dist:12.5, target:new THREE.Vector3(0, 0.5, 0) };
const pinch = { d:0 };
const pickables = faders.flatMap(f => { const m = []; f.handle.traverse(o => { if (o.isMesh) m.push(o); }); return m; });

function setNdc(e) {
  const r = el.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
}
// project the pointer ray onto the fader's vertical plane (facing the camera, through the fader axis)
function pointerToDb(e, f) {
  setNdc(e); ray.setFromCamera(ndc, camera);
  const n = camera.getWorldDirection(new THREE.Vector3()); n.y = 0; n.normalize().negate();
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(n, f.group.position);
  const p = new THREE.Vector3();
  if (!ray.ray.intersectPlane(plane, p)) return null;
  return yToDb(p.y - f.group.position.y);
}
let lastTap = { t:0, i:-1 };

el.addEventListener('pointerdown', e => {
  el.setPointerCapture(e.pointerId);
  setNdc(e); ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, false);
  if (hits.length) {
    const i = hits[0].object.userData.index;
    const now = performance.now();
    if (lastTap.i === i && now - lastTap.t < 320) { setFader(i, 0); }
    lastTap = { t:now, i };
    const f = faders[i];
    const grabDb = pointerToDb(e, f);
    active.set(e.pointerId, { kind:'fader', i, offset: grabDb == null ? 0 : f.db - grabDb });
    f.glow.material.emissiveIntensity = 2.6;
    audio.resume();
  } else {
    active.set(e.pointerId, { kind:'orbit', x:e.clientX, y:e.clientY });
  }
});
el.addEventListener('pointermove', e => {
  const a = active.get(e.pointerId); if (!a) return;
  if (a.kind === 'fader') {
    const db = pointerToDb(e, faders[a.i]);
    if (db != null) setFader(a.i, yToDb(((db + a.offset) / RANGE) * (TRACK_H / 2)));
  } else {
    const orbiters = [...active.values()].filter(v => v.kind === 'orbit');
    if (orbiters.length >= 2) {                // two-finger pinch zoom
      const pts = [...active.entries()].filter(([, v]) => v.kind === 'orbit');
      a.x = e.clientX; a.y = e.clientY;
      const [p, q] = pts.map(([, v]) => v);
      const d = Math.hypot(p.x - q.x, p.y - q.y);
      if (pinch.d) orbit.dist = Math.max(5, Math.min(22, orbit.dist * (pinch.d / d)));
      pinch.d = d; return;
    }
    orbit.theta -= (e.clientX - a.x) * 0.006;
    orbit.phi = Math.max(-0.1, Math.min(1.2, orbit.phi + (e.clientY - a.y) * 0.006));
    a.x = e.clientX; a.y = e.clientY;
  }
});
const end = e => {
  const a = active.get(e.pointerId);
  if (a && a.kind === 'fader') faders[a.i].glow.material.emissiveIntensity = 0.9;
  active.delete(e.pointerId); pinch.d = 0;
};
el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
el.addEventListener('wheel', e => { e.preventDefault(); orbit.dist = Math.max(5, Math.min(22, orbit.dist * (1 + e.deltaY * 0.001))); }, { passive:false });

// ---------- UI ----------
const playBtn = document.getElementById('play');
const sourceSel = document.getElementById('source');
const fileIn = document.getElementById('file');
async function startSource() {
  try {
    await audio.start(sourceSel.value, fileIn.files[0]);
    playBtn.textContent = '■ Stop'; playBtn.classList.add('on');
  } catch (err) { alert('Could not start audio: ' + err.message); }
}
playBtn.onclick = async () => {
  if (audio.playing) { audio.stop(); playBtn.textContent = '▶ Start'; playBtn.classList.remove('on'); }
  else await startSource();
};
sourceSel.onchange = () => { if (audio.playing) startSource(); };
fileIn.onchange = () => { if (fileIn.files[0]) { sourceSel.value = 'file'; startSource(); } };
// presets (eq.js): EQ values move the 3D faders; the rest of the mastering chain is applied by the engine.
let currentPreset = null;
const presetSel = document.getElementById('preset');
for (const p of Object.values(MASTER_PRESETS)) {
  const o = document.createElement('option'); o.value = p.id; o.title = p.description;
  o.textContent = p.lufsTarget == null ? `${p.id} · ${p.label}` : `${p.id} · ${p.label} (${p.lufsTarget} LUFS, ${p.truePeakLimit} dBTP)`;
  presetSel.appendChild(o);
}
presetSel.onchange = () => {
  if (!presetSel.value) return;
  currentPreset = getPresetById(presetSel.value);
  setFader(0, currentPreset.eq.low); setFader(1, currentPreset.eq.mid); setFader(2, currentPreset.eq.high);
  audio.applyMaster(currentPreset);
};
document.getElementById('reset').onclick = () => {
  faders.forEach((_, i) => setFader(i, 0));
  currentPreset = null; presetSel.value = ''; audio.applyMaster(null);
};

// meter readout: approximate momentary loudness + sample peak vs. the preset's targets
const meterEl = document.getElementById('meter');
let lastMeter = 0;
function updateMeter(now) {
  if (now - lastMeter < 100) return; lastMeter = now;
  const m = audio.meter();
  if (!m) { meterEl.textContent = ''; return; }
  const fmt = v => (isFinite(v) ? v.toFixed(1).replace('-', '−') : '—');
  const lt = currentPreset?.lufsTarget, pl = currentPreset?.truePeakLimit;
  const hot = (pl != null && m.peak > pl) ? 'var(--copper)' : 'inherit';
  meterEl.innerHTML = `Loudness <b>${fmt(m.lufs)} LUFS</b>${lt != null ? ` · target ${lt}` : ''}<br>` +
    `Peak <b style="color:${hot}">${fmt(m.peak)} dBFS</b>${pl != null ? ` · limit ${pl}` : ''}`;
}

// ---------- loop ----------
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
orbit.dist = innerWidth < innerHeight ? 17 : 12.5;

const spec = new Uint8Array(1024);
function frame(now) {
  requestAnimationFrame(frame);
  updateMeter(now);
  const cp = Math.cos(orbit.phi), sp = Math.sin(orbit.phi);
  camera.position.set(orbit.target.x + orbit.dist * Math.sin(orbit.theta) * cp,
                      orbit.target.y + orbit.dist * sp,
                      orbit.target.z + orbit.dist * Math.cos(orbit.theta) * cp);
  camera.lookAt(orbit.target);

  const n = audio.spectrum(spec);               // log-spaced bins -> bars
  for (let i = 0; i < NBARS; i++) {
    const v = n ? spec[Math.floor(Math.pow(i / NBARS, 2.2) * (n - 1))] / 255 : 0;
    const h = 0.05 + v * 3.2;
    bars[i].scale.y += (h - bars[i].scale.y) * 0.4;
    bars[i].position.y = DESK_Y + bars[i].scale.y / 2;
  }
  let b = 0; if (n) { for (let i = 0; i < 6; i++) b += spec[i]; b /= 6 * 255; }
  bass += (b - bass) * 0.25;
  graffiti.material.opacity = 0.55 + 0.45 * Math.min(1, bass * 1.6);       // the ghost brightens on the low end
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
